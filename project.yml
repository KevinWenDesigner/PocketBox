name: PocketBox
options:
  bundleIdPrefix: com.pocketbox
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PocketBox:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PocketBox
        excludes:
          - "**/*.md"
    info:
      path: PocketBox/Info.plist
    entitlements:
      path: PocketBox/PocketBox.entitlements
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbox.tv
        PRODUCT_NAME: PocketBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

  PocketBoxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: PocketBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbox.tv.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketBox.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PocketBox"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
