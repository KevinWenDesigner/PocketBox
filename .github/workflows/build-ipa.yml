name: Build PocketBox IPA (iOS 15+)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode and Simulator runtimes
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen and ldid
        run: |
          brew install xcodegen
          brew install ldid || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-ksplayer-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-ksplayer-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PocketBox.xcodeproj \
            -scheme PocketBox \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Run parser unit tests on iOS Simulator
        run: |
          DEST_OUTPUT=$(xcodebuild -showdestinations -project PocketBox.xcodeproj -scheme PocketBox -clonedSourcePackagesDirPath SourcePackages 2>&1 || true)
          echo "$DEST_OUTPUT"
          DEST_ID=$(python3 -c "import re,sys; txt=sys.stdin.read().split('Ineligible destinations')[0]; ids=[re.search(r'id:([0-9A-Fa-f-]{36})', l).group(1) for l in txt.splitlines() if 'platform:iOS Simulator' in l and 'name:iPhone' in l and re.search(r'id:([0-9A-Fa-f-]{36})', l)]; print(ids[0] if ids else '')" <<< "$DEST_OUTPUT")
          echo "Eligible Simulator ID: $DEST_ID"
          if [ -n "$DEST_ID" ]; then
            set -o pipefail
            xcodebuild test \
              -project PocketBox.xcodeproj \
              -scheme PocketBox \
              -sdk iphonesimulator \
              -destination "id=$DEST_ID" \
              -only-testing:PocketBoxTests \
              -clonedSourcePackagesDirPath SourcePackages 2>&1 | tee test.log || {
                echo '### Unit Test Failure Tail' >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                tail -n 60 test.log >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                exit 1
              }
          else
            echo "No eligible iOS Simulator found for this Xcode; skipping unit tests."
          fi

      - name: Build and Archive Release (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project PocketBox.xcodeproj \
            -scheme PocketBox \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/PocketBox.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee archive.log || {
              echo '### Archive Failure Tail' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 archive.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Package IPA (Unsigned & TrollStore ad-hoc)
        run: |
          mkdir -p build/unsigned/Payload
          ditto build/PocketBox.xcarchive/Products/Applications/PocketBox.app build/unsigned/Payload/PocketBox.app
          (cd build/unsigned && zip -r -y ../PocketBox-unsigned.ipa Payload)

          mkdir -p build/trollstore/Payload
          ditto build/PocketBox.xcarchive/Products/Applications/PocketBox.app build/trollstore/Payload/PocketBox.app
          if command -v ldid >/dev/null 2>&1; then
            find build/trollstore/Payload/PocketBox.app -name "*.framework" -o -name "*.dylib" | while read -r fw; do
              ldid -S "$fw" || true
            done
            ldid -SPocketBox/PocketBox.entitlements build/trollstore/Payload/PocketBox.app
          else
            codesign --force --deep --sign - --entitlements PocketBox/PocketBox.entitlements build/trollstore/Payload/PocketBox.app || true
          fi
          (cd build/trollstore && zip -r -y ../PocketBox-TrollStore.ipa Payload)
          ls -lh build/*.ipa

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketBox-iOS15-IPAs
          path: |
            build/PocketBox-unsigned.ipa
            build/PocketBox-TrollStore.ipa
          retention-days: 30
